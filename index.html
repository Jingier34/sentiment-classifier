<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sentiment Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 50px auto; padding: 20px; color: #333; }
        textarea { width: 100%; height: 140px; padding: 10px; box-sizing: border-box; font-size: 15px; }
        button { padding: 10px 16px; margin-top: 8px; border: none; border-radius: 4px; cursor: pointer; }
        #predictBtn { background: #4CAF50; color: white; width: 100%; font-size: 15px; }
        #predictBtn:disabled { background: #9e9e9e; cursor: default; }
        .examples button { background: #eee; margin-right: 6px; font-size: 13px; }
        .result { margin-top: 20px; padding: 16px; border-radius: 6px; background: #f4f4f4; display: none; }
        .label { font-size: 22px; font-weight: bold; }
        .positive { color: #2e7d32; }
        .negative { color: #c62828; }
        .bar-track { background: #ddd; border-radius: 4px; height: 14px; margin-top: 10px; }
        .bar { height: 100%; border-radius: 4px; background: #4CAF50; }
        .error { color: #c62828; }
        .explanation { margin-top: 16px; font-size: 14px; }
        .term-row { margin-top: 8px; }
        .chip { display: inline-block; padding: 3px 8px; margin: 3px 4px 0 0; border-radius: 12px; font-size: 13px; }
        .chip.pos { background: #e8f5e9; color: #2e7d32; }
        .chip.neg { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <h1>Sentiment Classifier</h1>
    <p>Enter a movie review and the model will predict whether it is positive or negative.</p>

    <div class="examples">
        <button data-text="An absolute masterpiece. The acting was brilliant and I loved every minute.">Positive example</button>
        <button data-text="A complete waste of time. The plot made no sense and the ending was awful.">Negative example</button>
        <button data-text="The acting was brilliant, but the plot was slow and boring.">Mixed example</button>
        <button data-text="It was not bad at all, better than I expected.">"Not bad"</button>
    </div>

    <textarea id="reviewInput" placeholder="Type or paste a review here..."></textarea>
    <button id="predictBtn">Predict sentiment</button>

    <div class="result" id="result">
        <div class="label" id="resultLabel"></div>
        <div id="resultConfidence"></div>
        <div class="bar-track"><div class="bar" id="confidenceBar"></div></div>
        <div class="explanation" id="explanation">
            <div class="term-row"><strong>Pushed toward positive:</strong> <span id="positiveTerms"></span></div>
            <div class="term-row"><strong>Pushed toward negative:</strong> <span id="negativeTerms"></span></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('reviewInput');
        const button = document.getElementById('predictBtn');
        const resultBox = document.getElementById('result');
        const resultLabel = document.getElementById('resultLabel');
        const resultConfidence = document.getElementById('resultConfidence');
        const bar = document.getElementById('confidenceBar');
        const explanationBox = document.getElementById('explanation');
        const positiveTerms = document.getElementById('positiveTerms');
        const negativeTerms = document.getElementById('negativeTerms');

        document.querySelectorAll('.examples button').forEach(exampleButton => {
            exampleButton.addEventListener('click', () => {
                input.value = exampleButton.dataset.text;
            });
        });

        function showError(message) {
            resultBox.style.display = 'block';
            resultLabel.className = 'label error';
            resultLabel.textContent = `Error: ${message}`;
            resultConfidence.textContent = '';
            bar.parentElement.style.display = 'none';
            explanationBox.style.display = 'none';
        }

        // Build chips with textContent so terms are always shown as plain text
        function renderTerms(container, items, cssClass) {
            container.replaceChildren();
            if (items.length === 0) {
                container.textContent = 'none';
                return;
            }
            items.forEach(item => {
                const chip = document.createElement('span');
                chip.className = `chip ${cssClass}`;
                chip.textContent = item.term;
                container.appendChild(chip);
            });
        }

        button.addEventListener('click', async () => {
            const text = input.value.trim();
            if (!text) {
                showError('Please enter a review.');
                return;
            }
            button.disabled = true;
            button.textContent = 'Predicting...';
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(typeof data.detail === 'string' ? data.detail : 'Invalid input.');
                    return;
                }
                resultBox.style.display = 'block';
                resultLabel.className = `label ${data.label}`;
                resultLabel.textContent = data.label === 'positive' ? 'Positive' : 'Negative';

                if (data.confidence !== undefined) {
                    const percent = (data.confidence * 100).toFixed(1);
                    resultConfidence.textContent = `Confidence: ${percent}%`;
                    bar.parentElement.style.display = 'block';
                    bar.style.width = `${percent}%`;
                    bar.style.background = data.label === 'positive' ? '#4CAF50' : '#e53935';
                } else {
                    resultConfidence.textContent = '';
                    bar.parentElement.style.display = 'none';
                }

                if (data.explanation) {
                    explanationBox.style.display = 'block';
                    renderTerms(positiveTerms, data.explanation.positive, 'pos');
                    renderTerms(negativeTerms, data.explanation.negative, 'neg');
                } else {
                    explanationBox.style.display = 'none';
                }
            } catch (err) {
                showError('Could not reach the server.');
            } finally {
                button.disabled = false;
                button.textContent = 'Predict sentiment';
            }
        });
    </script>
</body>
</html>
